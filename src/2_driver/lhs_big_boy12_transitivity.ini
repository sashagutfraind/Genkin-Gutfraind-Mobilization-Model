; Implementation				
[RunLength]	
type = int
dist = fixed
value= 1000

[NumZealLevels]	
type = int
dist = fixed			
value= 3
;dist = uniformrange			
;range= 3,5,7
;we don't do 2 b/c it is not compatible with no moderates

