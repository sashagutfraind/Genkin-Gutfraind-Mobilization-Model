; configuration for LHS driver
[LHSconfig]
technique    = lhs
;technique    = random
;offset      = 0
seed        = 0
numSamples  = 6000
burnin      = 500  ;how long does it discard the data
serverList  = localhost:60001,localhost:60002,localhost:60003,localhost:60004,localhost:60005,localhost:60006,localhost:60007,localhost:60008,localhost:60009,localhost:60010
dataDir     = lhs_2010_12_08
scanMinima  = False
; scanMinima = True
; scanMinima creates a special batch where sequentially each of the parameters is set to its minimal value, if possible (e.g. for numerical values)
scanMinimaSamplesPerParam = 5
; number of random samples to generate of the other parameters when doing minima scan. overrideds numSamples.

; example
; [Param1] 		;name
; possible values       
; type	      = double  ;also: boolean,string,int
; dist        = normal  ;also: fixed, uniform, uniformrange, (future: zipf)
; mean        = 21000   ;only required for normal
; sd          = 100     ;only required for normal
; min         = 1000    ;optional for normal
; max         = 50000   ;optional for normal
; value       = 17.0    ;only for type fixed

; Structural				
[Population]
type = int
dist = Normal	
mean = 10000		
sd   = 5000
min  = 1000
max  = 50000

[AttritionRate]
type = double
dist = Normal
mean = 0.10
sd   = 0.04
min  = 0.00
max  = 0.20

[RadicalsAttritionIncrement]
type = double
dist = Normal
mean = 0.03
sd   = 0.01
min  = -0.05
max  = 0.05
      
[AvgPressurability]
type = double
dist = Normal
mean = 0.33
sd   = 0.20
min  = 0.00
max  = 1.00
      
[FractionInitRadicals]
type = double
dist = Normal
mean = 0.05
sd   = 0.05
min  = 0.00   
max  = 0.50

[FractionInitPacifists]
type = double
dist = Normal
mean = 0.05
sd   = 0.05
min  = 0.00
max  = 0.50

; Individual				
[NumFixedAttributes]
type = int
dist = Normal
mean = 5   
sd   = 2   
min  = 0   
max  = 9   

[NumVarAttributes]
type = int
dist = Normal
mean = 7   
sd   = 3   
min  = 0   
max  = 12  

[FixedAttribSalience]
