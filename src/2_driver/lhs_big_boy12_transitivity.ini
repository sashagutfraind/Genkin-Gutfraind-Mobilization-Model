mean = 2.0 
sd   = 1.0 
min  = 0   
max  = 10  

[ZealSalience]
type = double
dist = Normal
mean = 2.0 
sd   = 1.0 
min  = 0   
max  = 10  

[NumMagnetsN]
type = int
dist = Uniform
min  = 0  
max  = 200 

[NumMagnetsR]
type = int
dist = Uniform
min  = 0   
max  = 50  

[NumMagnetsP]
type = int
dist = Uniform
min  = 0   
max  = 50  

[Diversity]	
type = double
dist = Normal
mean = 0.25
sd   = 0.10
min  = 0   
max  = 0.50

[MagneticEncounterRate]
type = double
dist = Normal
mean = 0.20
sd   = 0.10
min  = 0.00
max  = 1.00

[FractionExposedToMagnets]
type = double
dist = Normal
mean = 0.03
sd   = 0.03
min  = 0.00
max  = 0.10

; Network				
[AvgDegree]	
type = double
dist = Normal
mean = 5   
sd   = 5   
min  = 0   
max  = 30  

[RepellingTies]
type = boolean
dist = Fixed	
value= false		
      
[SafeNewFriends]
type = boolean
dist = Fixed	
value= true		

[TransitiveFriendship]
type = double
dist = Normal
mean = 0.10
sd   = 0.10
min  = 0.00
max  = 1.00

[AvgInitTieStrength]
type = double
dist = Normal
mean = 0.10
sd   = 0.30
min  = 0.00
max  = 1.00

;Superfluous for repellingTies == False
;[Disconnection Threshold]
;type = double
;dist = Uniform
;min  = 0.01
;max  = 0.10

[LinkAgeBonusFactor]	
type = double
dist = Normal
mean = 100
sd   = 50  
min  = 0.1 
max  = 500 

[MaxLinkAgeBonus]	
type = double
dist = Normal
mean = 1.0 
